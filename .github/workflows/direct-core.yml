name: Direct core tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  direct-core:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install direct-core dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy wn vaderSentiment

      - name: Check active core syntax and JSON configuration
        run: |
          python -m py_compile run_abin.py thalamus.py conversation.py direct_reasoning.py language_generation.py language_comprehension.py shared_representation.py direct_notus.py notus_fact_text.py language_builder.py live_notus_memory_check.py
          python -c "import glob,json; [json.load(open(path, encoding='utf-8')) for path in glob.glob('*.json')]"

      - name: Run native cognitive ownership tests
        run: python -m pytest -q test_shared_representation_semantics.py test_shared_representation_native.py test_language_native.py test_native_routing.py test_language_builder.py

      - name: Run direct-core pipeline regression tests
        run: python -m pytest -q test_direct_core_pipeline.py test_notus_integration.py

      - name: Run live Notus memory behavior check
        run: python live_notus_memory_check.py
