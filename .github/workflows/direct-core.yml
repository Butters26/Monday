name: Direct core tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  direct-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Check production Python syntax and JSON configuration
        run: |
          python -c "import pathlib, py_compile; [py_compile.compile(str(path), doraise=True) for path in sorted(pathlib.Path('.').rglob('*.py')) if not path.name.startswith('test_') and path.name != 'integration_test.py']"
          python -c "import glob,json; [json.load(open(path, encoding='utf-8')) for path in glob.glob('*.json')]"
      - name: Run maintained test suite
        run: python -m pytest -q
