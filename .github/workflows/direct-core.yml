name: Direct core tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  direct-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Check direct-core syntax and JSON configuration
        run: |
          python -m py_compile run_abin.py thalamus.py direct_reasoning.py direct_notus.py
          python -c "import glob,json; [json.load(open(path, encoding='utf-8')) for path in glob.glob('*.json')]"
      - name: Run direct-core tests
        run: python -m pytest -q test_direct_core_pipeline.py
