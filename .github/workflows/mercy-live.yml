name: Mercy live

# Boots Mercy with the tracer on, talks to her, and shows live in this log
# what is said to her, what every lobe does, and what she says back.
#
# To talk to her yourself: edit live_test_messages.txt on GitHub (one message
# per line) and save it. This runs, and you watch it here as it happens.
# It also runs on every push, so every change to her is tested live here.

on:
  push:
  workflow_dispatch:
    inputs:
      messages:
        description: "What to say to her (one message per line). Empty: live_test_messages.txt"
        required: false

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install what she needs
        run: python -m pip install --disable-pip-version-check numpy wn vaderSentiment

      - name: Build her offline dictionary
        run: python -c "from lexicon.oewn_offline import ensure_oewn; ensure_oewn()" > /dev/null

      - name: Boot her and talk to her (live)
        env:
          MESSAGES: ${{ github.event.inputs.messages }}
          MERCY_RUNTIME_DIR: ${{ runner.temp }}/mercy
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p "$MERCY_RUNTIME_DIR"
          MERCY_TRACE=1 python _mercy_chat_daemon.py > "$MERCY_RUNTIME_DIR/daemon.log" 2>&1 &
          for i in $(seq 1 180); do [ -S "$MERCY_RUNTIME_DIR/chat.sock" ] && break; sleep 1; done
          if [ ! -S "$MERCY_RUNTIME_DIR/chat.sock" ]; then echo "!!! She did not boot"; cat "$MERCY_RUNTIME_DIR/daemon.log"; exit 1; fi
          python live_view.py "$MERCY_RUNTIME_DIR/trace.jsonl" &
          sleep 1
          if [ -n "$MESSAGES" ]; then printf '%s\n' "$MESSAGES"; else cat live_test_messages.txt; fi > "$MERCY_RUNTIME_DIR/messages.txt"
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            python _mercy_say.py "$line" > /dev/null || echo "!!! Could not reach her for: $line"
            sleep 1
          done < "$MERCY_RUNTIME_DIR/messages.txt"
          sleep 3

      - name: Trace report
        if: always()
        run: |
          python trace_report.py "${{ runner.temp }}/mercy/trace.jsonl" || true
          echo; echo "== Her own log while she ran =="; cat "${{ runner.temp }}/mercy/daemon.log" || true
