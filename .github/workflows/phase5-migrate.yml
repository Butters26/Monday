name: Phase 5 native migration

on:
  push:
    branches: [main]
    paths:
      - phase5_migrate.py
      - .github/workflows/phase5-migrate.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy psycopg2-binary
      - name: Apply migration in validation workspace
        run: |
          cp .github/workflows/direct-core.yml /tmp/direct-core.yml
          cp .github/workflows/phase5-migrate.yml /tmp/phase5-migrate.yml
          cp phase5_migrate.py /tmp/phase5_migrate.py
          python phase5_migrate.py
          mkdir -p .github/workflows
          cp /tmp/direct-core.yml .github/workflows/direct-core.yml
          cp /tmp/phase5-migrate.yml .github/workflows/phase5-migrate.yml
          cp /tmp/phase5_migrate.py phase5_migrate.py
      - name: Verify native source syntax
        run: python -m py_compile run_abin.py thalamus.py conversation.py direct_reasoning.py language_generation.py language_comprehension.py shared_representation.py notus.py notus_memory.py
      - name: Verify native architecture
        run: python -m pytest -q test_shared_representation_semantics.py test_shared_representation_native.py test_language_native.py test_native_routing.py test_direct_core_pipeline.py test_notus_integration.py
      - name: Commit validated native migration
        run: |
          git config user.name "Mercy Phase 5 Migration"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "Complete Phase 5 native cognitive migration"
          git push origin HEAD:main
